        body {background-color: black;}

            color: rgb(255, 255, 255);

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <script>
        var arr = []
        for( i = 0; i < 48; i++){ arr.push(0) }
        
        function hs(r1, r2) {
            return "0x"+parseInt(arr.slice(r1,r2).join(""), 2).toString(16).toUpperCase().padStart(4, '0')
        }

        function gethex() {
            document.getElementById("display").innerHTML= hs(32,48) + " " + hs(16,32) + " " + hs(0,16)
            document.getElementById("bin").innerHTML=arr.join("").match(/.{1,4}/g).join(" ")
        }

        function s(el,id) {
            arr[id-1] = + !arr[id-1]
            el.setAttribute("fill",arr[id-1] == 1 ? "white":"#3D3D3D")
            gethex()
        }

    </script>
</head>
<body>
    <div class="result">
        <div id="display">0x0000 0x0000 0x0000</div>
        <div id="bin">0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 </div>
    </div>
